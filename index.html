<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="shortcut icon" href="https://c.s-microsoft.com/favicon.ico?v2" />
  <link rel="stylesheet" href="converter.css">
  <title>Temperature Converter</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="temp-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>
        </svg>
      </div>
      <h1>Temperature Converter</h1>
      <p>Professional precision conversion</p>
    </div>
    
    <form id="converter">
      <div class="input-group">
        <label for="input-temp">Input Value</label>
        <input type="text" id="input-temp" name="input-temp" value="20" />
      </div>
      
      <div class="input-group">
        <label for="input-unit">From Unit</label>
        <select id="input-unit" name="input-unit">
          <option value="c" selected>Celsius (°C)</option>
          <option value="f">Fahrenheit (°F)</option>
          <option value="k">Kelvin (K)</option>
        </select>
      </div>
      
      <button type="button" class="swap-btn" id="swap-btn" title="Swap units">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4M7 4L3 8M7 4l4 4"/>
          <path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
        </svg>
      </button>
      
      <div class="input-group">
        <label for="output-unit">To Unit</label>
        <select id="output-unit" name="output-unit">
          <option value="c">Celsius (°C)</option>
          <option value="f" selected>Fahrenheit (°F)</option>
          <option value="k">Kelvin (K)</option>
        </select>
      </div>
      
      <div class="output-section">
        <div class="output-label">Result</div>
        <output name="output-temp" id="output-temp" for="input-temp input-unit output-unit">68 °F</output>
      </div>
    </form>
  </div>
  
  <script src="converter.js"></script>
  <script>
    if('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(reg => {
          console.log('SW registrado:', reg);
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                if(confirm('Nueva versión disponible. ¿Actualizar?')) {
                  newWorker.postMessage({type: 'SKIP_WAITING'});
                  window.location.reload();
                }
              }
            });
          });
        });
    }
  </script>
</body>
</html>
